server {
  listen 8081;
  root /usr/share/nginx/html;

  # Uploads are streamed straight through; size limits are enforced by the API (quota + MAX_FILE_SIZE_BYTES).
  client_max_body_size 0;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  # Metrics are for the monitoring system inside the Docker network (api:8080), not for the internet.
  location = /api/v1/metrics { return 404; }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The service worker and manifest must always be re-checked, or a new release would not reach installed copies.
  # (`expires` is used instead of add_header so the security headers above still apply.)
  location = /sw.js { expires -1; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires 1h; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
