# CloudSeed for CasaOS. Nothing to edit: App Store > "+ Custom Install" > import / paste this file > Install.
# Then open the app and create your administrator account on the first page. The secrets are generated automatically.
name: cloudseed

x-env: &env
  NODE_ENV: production
  # Plain http is fine on a home network (the admin pages warn about it). Before opening it to the internet, put https in front
  # (Cloudflare Tunnel, Nginx Proxy Manager, Tailscale) and enter that address in the app under Administration > Sign-in.
  ALLOW_INSECURE_HTTP: "true"
  SECRETS_DIR: /secrets
  DB_HOST: postgres
  DB_USER: cloudseed
  DB_NAME: cloudseed
  MIGRATIONS_DIR: /app/migrations
  BACKUP_DIR: /backups

services:
  init:
    image: siyamexcom/cloudseed-api:latest
    container_name: cloudseed-init
    command: ["node", "dist/cli.js", "init-secrets"]
    environment: *env
    user: "0:0"   # CasaOS creates its folders as root, so the app must be allowed to write to them
    volumes:
      - /DATA/AppData/$AppID/secrets:/secrets
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: cloudseed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudseed
      POSTGRES_DB: cloudseed
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - /DATA/AppData/$AppID/pgdata:/var/lib/postgresql/data
      - /DATA/AppData/$AppID/secrets:/secrets:ro
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudseed -d cloudseed"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: siyamexcom/cloudseed-api:latest
    container_name: cloudseed-migrate
    command: ["node", "dist/db/migrate-cli.js"]
    environment: *env
    user: "0:0"
    volumes:
      - /DATA/AppData/$AppID/secrets:/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: siyamexcom/cloudseed-api:latest
    container_name: cloudseed-api
    restart: unless-stopped
    environment: *env
    user: "0:0"
    volumes:
      - /DATA/AppData/$AppID/secrets:/secrets:ro
      - /DATA/AppData/$AppID/storage:/data
      - /DATA/AppData/$AppID/backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s

  worker:
    image: siyamexcom/cloudseed-api:latest
    container_name: cloudseed-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *env
    user: "0:0"
    volumes:
      - /DATA/AppData/$AppID/secrets:/secrets:ro
      - /DATA/AppData/$AppID/storage:/data
      - /DATA/AppData/$AppID/downloads:/downloads
      - /DATA/AppData/$AppID/backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s

  web:
    image: siyamexcom/cloudseed-web:latest
    container_name: cloudseed-web
    restart: unless-stopped
    ports:
      - "8089:8081"      # open http://<casaos-ip>:8089
    depends_on:
      api: { condition: service_healthy }

x-casaos:
  architectures: [amd64, arm64]
  main: web
  author: siyamex
  category: Cloud
  description:
    en_us: Self-hosted cloud file manager with a download engine, torrents, Telegram delivery, media streaming and secure sharing.
  tagline:
    en_us: Your own cloud for files, downloads and media
  title:
    en_us: CloudSeed
  index: /
  port_map: "8089"
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Nextcloud/icon.png
